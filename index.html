<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أساطير الشارع - Street Legends | ساحة القتال</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 440px;
            width: 100%;
            background: #131b2e;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 2px solid #ef4444;
        }
        h1 {
            text-align: center;
            color: #f8fafc;
            margin-bottom: 3px;
            font-size: 22px;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 11px;
            margin-bottom: 15px;
        }
        .top-stats {
            display: flex;
            justify-content: space-between;
            background: #1e293b;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 13px;
            font-weight: bold;
        }
        /* ساحة القتال المرئية */
        .battle-arena {
            background: #090d16;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .fighters {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .fighter {
            text-align: center;
            width: 45%;
        }
        .fighter-avatar {
            font-size: 40px;
            margin-bottom: 5px;
        }
        .fighter-name {
            font-size: 12px;
            font-weight: bold;
            color: #f1f5f9;
            margin-bottom: 5px;
        }
        /* أشرطة الصحة */
        .health-bar-container {
            width: 100%;
            background: #334155;
            border-radius: 5px;
            height: 10px;
            overflow: hidden;
            border: 1px solid #475569;
        }
        .health-bar {
            height: 100%;
            width: 100%;
            background: #22c55e;
            transition: width 0.3s ease;
        }
        .enemy-health {
            background: #ef4444;
        }
        .vs-text {
            font-size: 16px;
            font-weight: bold;
            color: #f59e0b;
        }
        /* أزرار القتال */
        .combat-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.1s;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-attack {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
        }
        .btn-special {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            grid-column: span 2;
        }
        .btn:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
        }
        /* سجل المعركة */
        .log-box {
            background: #090d16;
            border-radius: 8px;
            padding: 10px;
            height: 90px;
            overflow-y: auto;
            font-size: 11px;
            color: #cbd5e1;
            border: 1px solid #1e293b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔥 أساطير الشارع 🔥</h1>
        <div class="subtitle">ساحة المواجهة والقتال المباشر</div>

        <div class="top-stats">
            <div>💵 الأموال: <span id="cashVal">0</span></div>
            <div>🏆 الانتصارات: <span id="winsVal">0</span></div>
        </div>

        <!-- ساحة المعركة -->
        <div class="battle-arena">
            <div class="fighters">
                <!-- اللاعب -->
                <div class="fighter">
                    <div class="fighter-avatar">🥋</div>
                    <div class="fighter-name">أنت (البطل)</div>
                    <div class="health-bar-container">
                        <div class="health-bar" id="playerHealthBar"></div>
                    </div>
                    <div style="font-size: 10px; color: #94a3b8; margin-top: 3px;"><span id="playerHpText">100</span>/100</div>
                </div>

                <div class="vs-text">VS</div>

                <!-- الخصم -->
                <div class="fighter">
                    <div class="fighter-avatar">🦹‍♂️</div>
                    <div class="fighter-name" id="enemyName">زعيـم العصابة</div>
                    <div class="health-bar-container">
                        <div class="health-bar enemy-health" id="enemyHealthBar"></div>
                    </div>
                    <div style="font-size: 10px; color: #94a3b8; margin-top: 3px;"><span id="enemyHpText">100</span>/100</div>
                </div>
            </div>
        </div>

        <!-- أزرار التحكم بالقتال -->
        <div class="combat-controls">
            <button class="btn btn-attack" id="attackBtn" onclick="playerAttack()">⚔️ هجوم سريع</button>
            <button class="btn" id="defendBtn" onclick="playerDefend()">🛡️ تكتيك دفاعي</button>
            <button class="btn btn-special" id="specialBtn" onclick="playerSpecial()">⚡ ضربة قاضية (تتطلب طاقة)</button>
        </div>

        <!-- سجل أحداث المعركة -->
        <div class="log-box" id="gameLog">
            بدأت المواجهة! اختر أسلوب هجومك واقضِ على خصمك في الشارع...<br>
        </div>
    </div>

    <script>
        let playerHp = 100;
        let enemyHp = 100;
        let cash = 0;
        let wins = 0;
        let isDefending = false;
        let specialCooldown = 0;

        const enemies = ["زعيم الحي الخلفي", "قائد العصابة الملثمة", "بلطجي الميناء", "مرعب الشوارع"];
        let currentEnemyName = enemies[0];

        function logMessage(msg) {
            const logBox = document.getElementById('gameLog');
            logBox.innerHTML = msg + "<br>" + logBox.innerHTML;
        }

        function updateUI() {
            document.getElementById('playerHealthBar').style.width = playerHp + "%";
            document.getElementById('playerHpText').innerText = Math.max(0, playerHp);
            
            document.getElementById('enemyHealthBar').style.width = enemyHp + "%";
            document.getElementById('enemyHpText').innerText = Math.max(0, enemyHp);
            
            document.getElementById('cashVal').innerText = cash;
            document.getElementById('winsVal').innerText = wins;
            document.getElementById('enemyName').innerText = currentEnemyName;
        }

        function playerAttack() {
            if (playerHp <= 0 || enemyHp <= 0) return;

            isDefending = false;
            let damageToEnemy = Math.floor(Math.random() * 12) + 15; // ضرر بين 15 و 26
            enemyHp -= damageToEnemy;
            logMessage("👊 سددت ضربة قوية للعدو وألحقت به " + damageToEnemy + " ضرراً!");

            checkBattleState();
            if (enemyHp > 0) {
                setTimeout(enemyTurn, 600);
            }
            updateUI();
        }

        function playerDefend() {
            if (playerHp <= 0 || enemyHp <= 0) return;

            isDefending = true;
            logMessage("🛡️ اتخذت وضعية دفاعية لتخفيف الضرر القادم!");
            
            setTimeout(enemyTurn, 600);
            updateUI();
        }

        function playerSpecial() {
            if (playerHp <= 0 || enemyHp <= 0) return;

            isDefending = false;
            let damageToEnemy = Math.floor(Math.random() * 20) + 30; // ضربة قاضية قوية
            enemyHp -= damageToEnemy;
            logMessage("⚡ أطلقت ضربة قاضية مدمرة أطاحت بـ " + damageToEnemy + " من طاقة العدو!");

            checkBattleState();
            if (enemyHp > 0) {
                setTimeout(enemyTurn, 600);
            }
            updateUI();
        }

        function enemyTurn() {
            if (enemyHp <= 0) return;

            let damageToPlayer = Math.floor(Math.random() * 10) + 10;
            if (isDefending) {
                damageToPlayer = Math.floor(damageToPlayer / 2);
                logMessage("🛡️ نجح دفاعك! قلل الضرر القادم إلى نصف القوة.");
                isDefending = false;
            }

            playerHp -= damageToPlayer;
            logMessage("⚠️ رد الخصم بهجوم عنيف وأصابك بـ " + damageToPlayer + " ضرراً!");

            checkBattleState();
            updateUI();
        }

        function checkBattleState() {
            if (enemyHp <= 0) {
                wins++;
                let reward = 200 + (wins * 50);
                cash += reward;
                logMessage("🎉 مبروك! انتصرت في المعركة وكسبت 💵 " + reward);
                
                // إعادة تجهيز خصم جديد أقوى
                setTimeout(resetBattle, 2000);
            } else if (playerHp <= 0) {
                logMessage("💀 هُزمت في المعركة... جاري استعادة وعيك للثأر...");
                setTimeout(resetBattle, 2000);
            }
        }

        function resetBattle() {
            playerHp = 100;
            enemyHp = 100 + (wins * 20); // زيادة صعوبة الخصم القادم
            let randomIdx = Math.floor(Math.random() * enemies.length);
            currentEnemyName = enemies[randomIdx];
            logMessage("🔄 تبدأ معركة جديدة ضد: " + currentEnemyName);
            updateUI();
        }

        // التهيئة الأولى
        updateUI();
    </script>

</body>
</html>
