<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أساطير الشارع - Street Legends</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f111a;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: #1a1d29;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border: 1px solid #2d3250;
        }
        h1 {
            text-align: center;
            color: #ff4757;
            margin-bottom: 5px;
            font-size: 26px;
        }
        .subtitle {
            text-align: center;
            color: #a4b0be;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .stats-box {
            background: #11131c;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #ff4757;
        }
        .score {
            font-size: 32px;
            font-weight: bold;
            color: #2ed573;
        }
        .label {
            font-size: 14px;
            color: #a4b0be;
        }
        .main-btn {
            width: 100%;
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 18px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            transition: 0.1s;
            margin-bottom: 20px;
        }
        .main-btn:active {
            transform: scale(0.97);
        }
        .section-title {
            font-size: 16px;
            color: #ffa502;
            margin-bottom: 10px;
            border-bottom: 1px solid #2d3250;
            padding-bottom: 5px;
        }
        .upgrade-btn {
            width: 100%;
            background: #2f3542;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
            border: 1px solid #57606f;
        }
        .upgrade-btn:hover {
            background: #57606f;
        }
        .upgrade-btn:disabled {
            background: #1e2229;
            color: #57606f;
            border-color: #2d3250;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔥 أساطير الشارع 🔥</h1>
        <div class="subtitle">ابنِ إمبراطوريتك وسيطر على الحي</div>

        <div class="stats-box">
            <div class="label">إجمالي النفوذ (النقاط)</div>
            <div class="score" id="score">0</div>
            <div style="font-size: 12px; color: #747d8c; margin-top: 5px;" id="cps">يكسب: 0 نقطة / ثانية</div>
        </div>

        <button class="main-btn" onclick="boostScore()">⚡ فرض السيطرة</button>

        <div class="section-title">🛠️ تطويرات وترقيات</div>
        
        <button class="upgrade-btn" id="buyFollower" onclick="buyFollower()">
            <span>👥 تجنيد تابع (+1/ثانية)</span>
            <span id="followerCost">15 نقطة</span>
        </button>

        <button class="upgrade-btn" id="buyPower" onclick="buyPower()">
            <span>💪 تقوية الضربة (+1 للنقرة)</span>
            <span id="powerCost">50 نقطة</span>
        </button>
    </div>

    <script>
        let score = 0;
        let clickPower = 1;
        let cps = 0;
        
        let followerCost = 15;
        let followerCount = 0;
        
        let powerCost = 50;

        function boostScore() {
            score += clickPower;
            updateDisplay();
        }

        function buyFollower() {
            if (score >= followerCost) {
                score -= followerCost;
                followerCount++;
                cps++;
                followerCost = Math.floor(followerCost * 1.5);
                updateDisplay();
            }
        }

        function buyPower() {
            if (score >= powerCost) {
                score -= powerCost;
                clickPower++;
                powerCost = Math.floor(powerCost * 2);
                updateDisplay();
            }
        }

        function updateDisplay() {
            document.getElementById('score').innerText = score;
            document.getElementById('cps').innerText = "يكسب: " + cps + " نقطة / ثانية";
            document.getElementById('followerCost').innerText = followerCost + " نقطة";
            document.getElementById('powerCost').innerText = powerCost + " نقطة";

            // تعطيل أو تفعيل الأزرار حسب الرصيد
            document.getElementById('buyFollower').disabled = score < followerCost;
            document.getElementById('buyPower').disabled = score < powerCost;
        }

        // نظام النقاط التلقائية كل ثانية
        setInterval(function() {
            score += cps;
            updateDisplay();
        }, 1000);
    </script>

</body>
</html>
