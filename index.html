<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Street Legends Test</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial;
  background:#101827;
}

#screen{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:white;
  text-align:center;
}

h1{
  font-size:42px;
  margin:0 0 10px;
}

p{
  font-size:20px;
  color:#ccc;
}

button{
  margin-top:20px;
  padding:15px 35px;
  border:0;
  border-radius:12px;
  background:#ffd21c;
  font-size:20px;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="screen">
  <h1>⚽ حريف الشارع</h1>
  <p>اختبار اللعبة يعمل بنجاح ✅</p>
  <button onclick="test()">اضغط هنا</button>
</div>

<script>
function test(){
  document.querySelector("p").textContent="JavaScript يعمل أيضًا ✅";
}
</script>

</body>
</html>
