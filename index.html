<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أساطير الشارع - Street Legends</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0c10;
            color: #ffffff;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 420px;
            width: 100%;
            background: #1f2833;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border: 2px solid #66fcf1;
        }
        h1 {
            text-align: center;
            color: #66fcf1;
            margin-bottom: 5px;
            font-size: 26px;
        }
        .subtitle {
            text-align: center;
            color: #c5c6c7;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: #0b0c10;
            border: 1px solid #45a29e;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #66fcf1;
            margin-top: 5px;
        }
        .action-area {
            background: #0b0c10;
            border: 2px dashed #45a29e;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        .main-action-btn {
            background: linear-gradient(135deg, #45a29e, #66fcf1);
            color: #0b0c10;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 252, 241, 0.3);
            transition: 0.1s;
            width: 100%;
        }
        .main-action-btn:active {
            transform: scale(0.96);
        }
        .section-title {
            font-size: 15px;
            color: #66fcf1;
            margin-bottom: 10px;
            border-bottom: 1px solid #45a29e;
            padding-bottom: 5px;
        }
        .log-box {
            background: #0b0c10;
            border-radius: 8px;
            padding: 10px;
            height: 90px;
            overflow-y: auto;
            font-size: 12px;
            color: #c5c6c7;
            border: 1px solid #45a29e;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔥 أساطير الشارع 🔥</h1>
        <div class="subtitle">النسخة الرسمية المطورة حسب الاتفاق</div>

        <div class="stats-grid">
            <div class="stat-box">
                <div style="font-size: 12px; color: #c5c6c7;">النفوذ والقوة</div>
                <div class="stat-value" id="power">100</div>
            </div>
            <div class="stat-box">
                <div style="font-size: 12px; color: #c5c6c7;">السيطرة على الحي</div>
                <div class="stat-value" id="territory">منطقة 1</div>
            </div>
        </div>

        <div class="action-area">
            <button class="main-action-btn" onclick="performAction()">⚔️ فرض النفوذ والسيطرة</button>
        </div>

        <div class="section-title">📜 سجل أحداث الشارع</div>
        <div class="log-box" id="gameLog">
            أهلاً بك يا زعيم في أساطير الشارع. ابدأ فرض النفوذ والسيطرة الآن...<br>
        </div>
    </div>

    <script>
        let power = 100;
        let territoryLevel = 1;

        function logMessage(msg) {
            const logBox = document.getElementById('gameLog');
            logBox.innerHTML = msg + "<br>" + logBox.innerHTML;
        }

        function performAction() {
            power += 15;
            document.getElementById('power').innerText = power;
            
            if (power >= territoryLevel * 200) {
                territoryLevel++;
                document.getElementById('territory').innerText = "منطقة " + territoryLevel;
                logMessage("👑 تم توسيع النفوذ والسيطرة والانتقال إلى المستوى " + territoryLevel + "!");
            } else {
                logMessage("⚡ تم تنفيذ عملية ناجحة في الشارع (+15 نفوذ)");
            }
        }
    </script>

</body>
</html>
